spring:
  application:
    name: Quotation-Generator
  datasource:
    url: jdbc:h2:file:./data/quotdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 1120

quotation:
  vat:
    rate: 0.05
  storage:
    logo-dir: ./uploads/logos