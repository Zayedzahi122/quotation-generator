<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Company Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container">
    <div class="mb-4">
        <h2 class="fw-bold">Company Profile</h2>
        <p class="text-muted mb-0">These details appear in the "From" section of every quotation.</p>
    </div>

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-header bg-white fw-semibold"><i class="bi bi-building"></i> Company details</div>
                <div class="card-body">
                    <form method="post" th:action="@{/profile}" th:object="${profileForm}">
                        <input type="hidden" th:field="*{id}">
                        <input type="hidden" th:field="*{logoFileName}">

                        <div class="mb-3">
                            <label class="form-label">Company name</label>
                            <input type="text" class="form-control" th:field="*{companyName}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <input type="text" class="form-control" th:field="*{address}"
                                   placeholder="Street, city, country">
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Phone number</label>
                                <input type="tel" class="form-control" th:field="*{phone}" placeholder="+968 ...">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email address</label>
                                <input type="email" class="form-control" th:field="*{email}" placeholder="info@company.com">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i> Save details</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="card shadow-sm">
                <div class="card-header bg-white fw-semibold"><i class="bi bi-image"></i> Company logo</div>
                <div class="card-body">
                    <div class="text-center p-3 mb-3 bg-white border rounded" style="min-height: 140px;">
                        <img th:if="${profile.logoFileName != null}" class="img-fluid"
                             style="max-height: 110px;"
                             th:src="@{/logos/{fileName}(fileName=${profile.logoFileName})}" alt="Current logo">
                        <div th:if="${profile.logoFileName == null}" class="text-muted py-4">
                            <i class="bi bi-image" style="font-size: 2rem;"></i>
                            <div class="small mt-2">No logo uploaded yet</div>
                        </div>
                    </div>

                    <form method="post" th:action="@{/profile/logo}" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label">Upload new logo</label>
                            <input type="file" class="form-control" name="logo" accept=".png,.jpg,.jpeg,.webp,.svg" required>
                            <div class="form-text">PNG, JPG, WEBP or SVG · up to 5 MB. Shown above the company name.</div>
                        </div>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-upload"></i> Upload logo</button>
                    </form>

                    <form method="post" th:action="@{/profile/logo/delete}" class="mt-3"
                          th:if="${profile.logoFileName != null}"
                          onsubmit="return confirm('Remove the company logo?')">
                        <button type="submit" class="btn btn-outline-danger w-100"><i class="bi bi-trash"></i> Remove logo</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
