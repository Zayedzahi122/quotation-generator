<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${customer.id} ? 'Edit Customer' : 'New Customer'">Customer Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
<div class="container">
    <h2 th:text="${customer.id} ? 'Edit Customer' : 'New Customer'">Customer</h2>

    <form th:action="${customer.id} ? @{/customers/{id}(id=${customer.id})} : @{/customers}" method="post" class="card p-4">
        <input type="hidden" name="id" th:value="${customer.id}">

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" name="name" th:value="${customer.name}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" th:value="${customer.email}">
        </div>
        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" class="form-control" name="phone" th:value="${customer.phone}">
        </div>
        <div class="mb-3">
            <label class="form-label">Address</label>
            <textarea class="form-control" name="address" rows="3" th:text="${customer.address}"></textarea>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">Save</button>
            <a class="btn btn-secondary" th:href="@{/customers}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
