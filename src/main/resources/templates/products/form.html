<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{fragments/pwa :: pwa}"></th:block>
    <title th:text="${product.id} ? 'Edit Product' : 'New Product'">Product Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
<div class="container">
    <h2 th:text="${product.id} ? 'Edit Product' : 'New Product'">Product</h2>

    <form th:action="${product.id} ? @{/products/{id}(id=${product.id})} : @{/products}" method="post" class="card p-4">
        <input type="hidden" name="id" th:value="${product.id}">

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" name="name" th:value="${product.name}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" rows="3" th:text="${product.description}"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Unit Price (OMR)</label>
            <input type="number" class="form-control" name="unitPrice" th:value="${product.unitPrice}" step="0.001" min="0" required>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">Save</button>
            <a class="btn btn-secondary" th:href="@{/products}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
