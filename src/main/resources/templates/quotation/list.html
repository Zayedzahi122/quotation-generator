<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quotations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Quotations</h2>
        <a class="btn btn-primary" th:href="@{/quotations/new}"><i class="bi bi-plus-circle"></i> New Quotation</a>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Number</th>
                    <th>Date</th>
                    <th>Customer</th>
                    <th>Status</th>
                    <th>Layout</th>
                    <th class="text-end">Total (OMR)</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="q : ${quotations}">
                    <td><a class="text-decoration-none fw-semibold" th:href="@{/quotations/{id}(id=${q.id})}" th:text="${q.number}"></a></td>
                    <td th:text="${q.date}"></td>
                    <td th:text="${q.customer?.name}">-</td>
                    <td><span class="badge bg-info text-dark" th:text="${q.status}"></span></td>
                    <td th:text="${q.layoutType}"></td>
                    <td class="text-end fw-semibold" th:text="${#numbers.formatDecimal(q.total, 1, 3)}"></td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/quotations/{id}(id=${q.id})}"><i class="bi bi-eye"></i> View</a>
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/quotations/{id}/edit(id=${q.id})}"><i class="bi bi-pencil"></i> Edit</a>
                    </td>
                </tr>
                <tr th:if="${quotations.isEmpty()}">
                    <td colspan="7" class="text-center py-5 text-muted">No quotations found</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
